<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2530" />
      <stop offset="100%" stop-color="#0e1117" />
    </linearGradient>
    <linearGradient id="spoolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e8e3" />
    </linearGradient>
    <filter id="recGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Dark Outer Canvas / CRT Screen Profile -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#080a0d" />

  <!-- VHS Cassette Outer Shell -->
  <rect x="4" y="8" width="56" height="48" rx="6" fill="url(#bodyGrad)" stroke="#384355" stroke-width="2.5" />

  <!-- Top Spine / Label Lip -->
  <rect x="12" y="8" width="40" height="5" fill="#293240" />

  <!-- Center Viewing Window Pocket -->
  <rect x="8" y="18" width="48" height="27" rx="4" fill="#050608" stroke="#2c3543" stroke-width="1.8" />

  <!-- Magnetic Tape Band Underneath -->
  <rect x="14" y="37" width="36" height="3" fill="#382215" />

  <!-- Left Spool (Reel) -->
  <circle cx="21" cy="31.5" r="9" fill="url(#spoolGrad)" />
  <circle cx="21" cy="31.5" r="3.6" fill="#050608" />
  <!-- Hub Cogs -->
  <rect x="20" y="26.4" width="2" height="2.5" fill="#050608" />
  <rect x="16.2" y="33.8" width="2.2" height="2" transform="rotate(-30 17.3 34.8)" fill="#050608" />
  <rect x="23.6" y="33.8" width="2.2" height="2" transform="rotate(30 24.7 34.8)" fill="#050608" />

  <!-- Right Spool (Reel) -->
  <circle cx="43" cy="31.5" r="9" fill="url(#spoolGrad)" />
  <circle cx="43" cy="31.5" r="3.6" fill="#050608" />
  <!-- Hub Cogs -->
  <rect x="42" y="26.4" width="2" height="2.5" fill="#050608" />
  <rect x="38.2" y="33.8" width="2.2" height="2" transform="rotate(-30 39.3 34.8)" fill="#050608" />
  <rect x="45.6" y="33.8" width="2.2" height="2" transform="rotate(30 46.7 34.8)" fill="#050608" />

  <!-- Bottom Shell Notches -->
  <rect x="10" y="49" width="4" height="4" rx="1" fill="#050608" />
  <rect x="50" y="49" width="4" height="4" rx="1" fill="#050608" />

  <!-- Broadcast REC Tally Lamp (Top-Right) -->
  <circle cx="53" cy="13.5" r="5" fill="#ff2626" opacity="0.38" />
  <circle cx="53" cy="13.5" r="3.4" fill="#ff2d2d" filter="url(#recGlow)" />
  <circle cx="51.8" cy="12.3" r="1.1" fill="#ffa8a8" />
</svg>